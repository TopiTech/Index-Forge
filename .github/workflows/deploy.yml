name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Inject D1 Database ID
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_ID" ]; then
            echo "Error: D1_DATABASE_ID secret is not set or empty!"
            exit 1
          fi
          sed -i "s/__D1_DATABASE_ID__/$D1_ID/g" wrangler.jsonc
          # 置換が成功したか（プレースホルダーが消えたか）確認
          if grep -q "__D1_DATABASE_ID__" wrangler.jsonc; then
            echo "Error: Database ID replacement failed!"
            exit 1
          fi
        shell: bash

      # INFRA-01: the dry run has to happen *after* the D1 id was injected,
      # because wrangler rejects the placeholder. It is the same gate the pull
      # request workflow runs, so a merge that skipped CI (an admin push, a
      # re-run of a skipped workflow, a squash merge with the checks bypassed)
      # cannot deploy a bundle that the pull request workflow would have
      # rejected.
      - name: Validate Worker Bundle (wrangler dry run)
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/wrangler-dry-run"

      # PERF-01 / PERF-02 gate: the first paint must not download the ticker
      # dataset or the chart library.
      - name: Check first-paint bundle budget (PERF-01/PERF-02)
        run: npm run check:first-paint

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
